# Render blueprint: Go API (Docker) + managed Postgres. Deploy with:
#   Render dashboard → New → Blueprint → point at this repo.
# Migrations run automatically on boot. After the first deploy, create an org +
# admin login by running the provision CLI once against DATABASE_URL (see README).
#
# Secrets marked `sync: false` must be filled in the Render dashboard — they are
# intentionally not committed. Plan names may need adjusting to your Render tier.
services:
  - type: web
    name: maintenance-hub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maintenance-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true            # >=32 chars, generated once by Render
      # AI provider — OpenRouter is preferred when its key is set. Paste the key
      # in the Render dashboard (never commit it).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash-lite   # cheap; swap for any OpenRouter slug
      # Anthropic fallback — used only if OPENROUTER_API_KEY is unset.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-haiku-4-5-20251001
      - key: CORS_ORIGINS
        sync: false                    # e.g. https://maintenance-hub-pi.vercel.app
      - key: OUTREACH_SIMULATE
        value: "1"                     # keep sends simulated until Twilio/SMTP creds are live
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Optional: only set if webhook signature validation fails because Render's
      # proxy rewrites host/proto (e.g. "https://maintenance-hub-api.onrender.com").
      - key: TWILIO_WEBHOOK_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: maintenance-hub-db
    databaseName: maintenance_hub
    plan: basic-256mb
    postgresMajorVersion: "16"
