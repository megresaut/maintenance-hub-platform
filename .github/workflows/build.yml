# CI: build the Relay (maintenance-hub) API image on GitHub's runners and push
# to GHCR. Light image (Go/Alpine, no Chromium). Deploy is a separate MANUAL
# workflow. Compartmentalized: this only ever touches Relay.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/relay-api:latest
            ghcr.io/${{ github.repository_owner }}/relay-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
